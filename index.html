<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Incubator Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 15px; margin: 10px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .temp { font-size: 2.5em; color: #ff9800; }
    .fan { font-size: 3em; display: inline-block; animation: spin 2s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <h2>🐣 RTN Smart Incubator</h2>

  <div class="card">
    <div class="fan">🌀</div>
    <div class="temp" id="tempVal">37.5 °C</div>
    <p>Humidity: <b id="humVal">65%</b> | Door: <b id="doorVal">CLOSED 🔒</b></p>
  </div>

  <div class="card">
    <h3>📦 1st Store</h3>
    <p id="store1Info">Loading store 1 info...</p>
  </div>

  <div class="card">
    <h3>📦 2nd Store</h3>
    <p id="store2Info">Loading store 2 info...</p>
  </div>

  <script>
    Telegram.WebApp.ready();
    // Google Sheets හෝ Firebase එකෙන් Data Fetch කරන JavaScript Logic එක මෙතැනට එකතු වේ
  </script>
</body>
</html>
