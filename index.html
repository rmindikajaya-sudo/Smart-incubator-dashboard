<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTN SMART Egg Incubator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #18222d);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #212e3c);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; margin-bottom: 12px; font-size: 18px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .card { background: var(--card-bg); padding: 14px; border-radius: 12px; text-align: center; }
        .card h3 { margin: 0 0 6px 0; font-size: 12px; opacity: 0.7; }
        .card .value { font-size: 22px; font-weight: bold; }
        .info-card { background: var(--card-bg); padding: 12px 14px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; display: flex; justify-content: space-between; }
        .sync-status { text-align: center; font-size: 11px; opacity: 0.5; margin-top: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🥚 RTN SMART Incubator</h2>

        <div class="grid-2">
            <div class="card">
                <h3>Temperature</h3>
                <div class="value" id="tempVal">-- °C</div>
            </div>
            <div class="card">
                <h3>Humidity</h3>
                <div class="value" id="humVal">-- %</div>
            </div>
        </div>

        <div class="info-card">
            <span>Door Status: <strong id="doorStatus">CLOSED 🔒</strong></span>
            <span>Angle: <strong id="trayPosVal">45°</strong></span>
        </div>

        <div class="info-card">
            <div><strong>1st Store</strong><br><small id="s1Type">Type: --</small></div>
            <div><strong id="s1Qty">0 Eggs</strong></div>
        </div>

        <div class="info-card">
            <div><strong>2nd Store</strong><br><small id="s2Type">Type: --</small></div>
            <div><strong id="s2Qty">0 Eggs</strong></div>
        </div>

        <div class="sync-status" id="syncStatus">Connecting to Firebase...</div>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://eggbotrm-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Realtime Data Sync
        const liveRef = ref(db, 'incubator');
        onValue(liveRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.live) {
                    document.getElementById('tempVal').innerText = data.live.temp + " °C";
                    document.getElementById('humVal').innerText = data.live.humidity + " %";
                    document.getElementById('doorStatus').innerText = data.live.door;
                    document.getElementById('trayPosVal').innerText = data.live.angle + "°";
                }
                if (data.stores) {
                    if (data.stores.store1) {
                        document.getElementById('s1Type').innerText = "Type: " + data.stores.store1.eggType;
                        document.getElementById('s1Qty').innerText = data.stores.store1.qty + " Eggs";
                    }
                    if (data.stores.store2) {
                        document.getElementById('s2Type').innerText = "Type: " + data.stores.store2.eggType;
                        document.getElementById('s2Qty').innerText = data.stores.store2.qty + " Eggs";
                    }
                }
                document.getElementById('syncStatus').innerText = "Last synced: " + new Date().toLocaleTimeString();
            }
        });
    </script>
</body>
</html>
