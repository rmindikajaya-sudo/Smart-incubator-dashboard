<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTN SMART Incubator Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .heater-on { background-color: #ef4444; color: white; }   /* Red for ON */
        .heater-off { background-color: #22c55e; color: white; }  /* Green for OFF */
        .fan-on { background-color: #3b82f6; color: white; }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .rotating-fan {
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🥚 RTN SMART Incubator</h2>

    <!-- Temperature & Humidity -->
    <div class="grid-2">
        <div class="card" style="flex-direction: column; align-items: flex-start;">
            <small>Temperature</small>
            <h3 id="temp">0.0 °C</h3>
        </div>
        <div class="card" style="flex-direction: column; align-items: flex-start;">
            <small>Humidity</small>
            <h3 id="humidity">0 %</h3>
        </div>
    </div>

    <!-- Tray Angle -->
    <div class="card">
        <div>
            <small>Current Tray Angle</small>
            <h3 id="trayAngle">45°</h3>
        </div>
        <span style="font-size: 24px;">📐</span>
    </div>

    <!-- Heater Status (Red for ON, Green for OFF) -->
    <div class="card">
        <div>
            <strong>Heater Status</strong>
        </div>
        <div id="heaterBadge" class="status-badge heater-off">OFF</div>
    </div>

    <!-- Fan Status & RPM with Animation -->
    <div class="card">
        <div>
            <strong>Circulation Fan</strong><br>
            <small>RPM: <span id="fanRpm">0</span></small>
        </div>
        <div>
            <span id="fanIcon" class="rotating-fan" style="font-size: 24px;">🌀</span>
            <div id="fanBadge" class="status-badge fan-on" style="margin-top: 5px; font-size: 12px;">ON</div>
        </div>
    </div>
</div>

<script>
    // Firebase REST API URL (ඔයාගේ රියල්ටයිම් ඩේටාබෙස් ලින්ක් එක මෙතැනට දෙන්න)
    const firebaseURL = "https://eggbotrm-default-rtdb.asia-southeast1.firebasedatabase.app/incubator/live.json";

    async function fetchData() {
        try {
            let response = await fetch(firebaseURL);
            let data = await response.json();
            if(data) {
                document.getElementById("temp").innerText = data.temp + " °C";
                document.getElementById("humidity").innerText = data.humidity + " %";
                document.getElementById("trayAngle").innerText = data.angle + "°";
                
                // Heater Color Update (ON = Red, OFF = Green)
                let heaterBadge = document.getElementById("heaterBadge");
                if(data.heater === "ON") {
                    heaterBadge.innerText = "ON";
                    heaterBadge.className = "status-badge heater-on";
                } else {
                    heaterBadge.innerText = "OFF";
                    heaterBadge.className = "status-badge heater-off";
                }

                // Fan RPM & Animation Update
                document.getElementById("fanRpm").innerText = data.rpm || 1200;
            }
        } catch (error) {
            console.error("Error fetching data:", error);
        }
    }

    setInterval(fetchData, 2000); // Fetch every 2 seconds
    fetchData();
</script>

</body>
</html>
