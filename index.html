<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Incubator Dashboard</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f6f9);
            --text-color: var(--tg-theme-text-color, #222);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --accent-red: #e74c3c;
            --accent-green: #2ecc71;
            --accent-orange: #f39c12;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .status-banner {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .badge.ok { background-color: rgba(46, 204, 113, 0.2); color: var(--accent-green); }
        .badge.alert { background-color: rgba(231, 76, 60, 0.2); color: var(--accent-red); }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            opacity: 0.7;
        }

        .card .value {
            font-size: 24px;
            font-weight: bold;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin: 20px 0 10px 0;
        }

        .tray-card {
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .control-panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🥚 Egg Incubator Dashboard</h2>

        <!-- Status Bar: Power & Door -->
        <div class="status-banner">
            <div>Power: <span id="powerStatus" class="badge ok">Grid Normal</span></div>
            <div>Door: <span id="doorStatus" class="badge ok">Closed</span></div>
        </div>

        <!-- Main Sensors Grid -->
        <div class="grid-2">
            <div class="card">
                <h3>Temperature</h3>
                <div class="value" id="tempVal">37.5°C</div>
            </div>
            <div class="card">
                <h3>Humidity</h3>
                <div class="value" id="humVal">60%</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>Heater Status</h3>
                <div class="value" id="heaterVal" style="color: var(--accent-orange);">OFF</div>
            </div>
            <div class="card">
                <h3>Fan Speed</h3>
                <div class="value" id="fanVal">80%</div>
            </div>
        </div>

        <!-- Tray Angles -->
        <div class="section-title">Tray Positions</div>
        <div class="tray-card">
            <span>Tray 1</span>
            <strong id="tray1Val">+45°</strong>
        </div>
        <div class="tray-card">
            <span>Tray 2</span>
            <strong id="tray2Val">0°</strong>
        </div>
        <div class="tray-card">
            <span>Tray 3</span>
            <strong id="tray3Val">-45°</strong>
        </div>

        <!-- Manual Controls -->
        <div class="control-panel">
            <div class="section-title" style="margin-top: 0;">Quick Actions</div>
            <button class="btn" onclick="sendDataToTelegram('manual_turn')">🔄 Force Tray Turn</button>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // මෙතැනට ඔයාගේ Google Sheet / Apps Script API URL එක දාන්න (ඩේටා ගන්න)
        const API_URL = "https://script.google.com/macros/s/AKfycbwURxBG6V8KiKjkPPbPVle8B7aUJohrQBo9cIKguoBw4pehLwSAAQETmXRzmvzh6brdsw/exec";

        function fetchData() {
            // උදාහරණයක් ලෙස Google Sheet එකෙන් ඩේටා fetch කර UI එක update කිරීම:
            /*
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('tempVal').innerText = data.temperature + "°C";
                    document.getElementById('humVal').innerText = data.humidity + "%";
                    document.getElementById('heaterVal').innerText = data.heater;
                    document.getElementById('fanVal').innerText = data.fan_speed + "%";
                    document.getElementById('tray1Val').innerText = data.tray1 + "°";
                    document.getElementById('tray2Val').innerText = data.tray2 + "°";
                    document.getElementById('tray3Val').innerText = data.tray3 + "°";
                    // Door & Power logic...
                });
            */
        }

        function sendDataToTelegram(action) {
            // බටන් එක එබූ විට Telegram Bot වෙත data යැවීම හෝ trigger කිරීම
            tg.sendData(JSON.stringify({ action: action }));
            tg.close();
        }

        // තත්පර 5කට වතාවක් ඩේටා Update වීමට
        // setInterval(fetchData, 5000);
        // fetchData();
    </script>
</body>
</html>
