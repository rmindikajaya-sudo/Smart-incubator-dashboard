<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTN SMART Incubator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b1329;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .header-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #e2e8f0;
        }
        .alert-box {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .status-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .status-card {
            background-color: #162238;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #1e293b;
        }
        .badge-grid {
            background-color: #22c55e;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-door {
            background-color: #22c55e;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .metric-box {
            background-color: #162238;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #1e293b;
        }
        .metric-box small {
            color: #94a3b8;
            font-size: 12px;
        }
        .metric-box h2 {
            margin: 5px 0 0 0;
            font-size: 24px;
            color: #ffffff;
        }
        .card {
            background-color: #162238;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            border: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 12px;
        }
        .heater-on { background-color: #ef4444; color: white; }   /* Red for ON */
        .heater-off { background-color: #22c55e; color: white; }  /* Green for OFF */
        .fan-on { background-color: #3b82f6; color: white; }
        .fan-off { background-color: #64748b; color: white; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .rotating-fan {
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        .stopped-fan {
            animation: none;
            display: inline-block;
        }
        .footer-text {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">🥚 RTN SMART Incubator</div>

    <div class="alert-box">
        🔔 System Active - Monitoring Incubator
    </div>

    <!-- Power & Door Status Row -->
    <div class="status-row">
        <div class="status-card">
            <span>Power:</span>
            <span class="badge-grid">Grid Normal</span>
        </div>
        <div class="status-card">
            <span>Door:</span>
            <span id="doorBadge" class="badge-door">CLOSED 🔒</span>
        </div>
    </div>

    <!-- Temperature & Humidity Cards -->
    <div class="metrics-grid">
        <div class="metric-box">
            <small>Temperature</small>
            <h2 id="temp">0.0 °C</h2>
        </div>
        <div class="metric-box">
            <small>Humidity</small>
            <h2 id="humidity">0 %</h2>
        </div>
    </div>

    <!-- Current Tray Angle (Clean single value as requested) -->
    <div class="card">
        <div>
            <small style="color: #94a3b8;">Current Tray Angle</small>
            <div style="font-size: 18px; font-weight: bold; margin-top: 3px;" id="trayAngle">45°</div>
        </div>
        <span style="font-size: 22px;">📐</span>
    </div>

    <!-- Heater Status Card (Red for ON, Green for OFF) -->
    <div class="card">
        <div>
            <strong>Heater Status</strong><br>
            <small style="color: #94a3b8;">Automatic Relay Control</small>
        </div>
        <div id="heaterBadge" class="status-badge heater-off">OFF</div>
    </div>

    <!-- Circulation Fan Card with RPM & Rotating Animation -->
    <div class="card">
        <div>
            <strong>Circulation Fan</strong><br>
            <small style="color: #94a3b8;">RPM: <span id="fanRpm">0</span></small>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="fanIcon" class="rotating-fan" style="font-size: 22px;">🌀</span>
            <div id="fanBadge" class="status-badge fan-on">ON</div>
        </div>
    </div>

    <div class="footer-text" id="syncTime">Last synced: --:--:--</div>
    <div class="footer-text" style="margin-top: 5px;">@EGG85_bot</div>
</div>

<script>
    // Firebase REST API URL
    const firebaseURL = "https://eggbotrm-default-rtdb.asia-southeast1.firebasedatabase.app/incubator/live.json";

    async function fetchData() {
        try {
            let response = await fetch(firebaseURL);
            let data = await response.json();
            if(data) {
                // Temp & Humidity
                document.getElementById("temp").innerText = (data.temp !== undefined ? data.temp : 0.0) + " °C";
                document.getElementById("humidity").innerText = (data.humidity !== undefined ? data.humidity : 0) + " %";
                
                // Current Tray Angle
                document.getElementById("trayAngle").innerText = (data.angle !== undefined ? data.angle : 45) + "°";
                
                // Door Status
                if(data.door) {
                    document.getElementById("doorBadge").innerText = data.door;
                }

                // Heater Status (ON = Red, OFF = Green)
                let heaterBadge = document.getElementById("heaterBadge");
                if(data.heater === "ON") {
                    heaterBadge.innerText = "ON";
                    heaterBadge.className = "status-badge heater-on";
                } else {
                    heaterBadge.innerText = "OFF";
                    heaterBadge.className = "status-badge heater-off";
                }

                // Fan Status, RPM & Animation
                let fanBadge = document.getElementById("fanBadge");
                let fanIcon = document.getElementById("fanIcon");
                let rpmVal = data.rpm || 0;
                document.getElementById("fanRpm").innerText = rpmVal;

                if(data.fan === "ON" || rpmVal > 0) {
                    fanBadge.innerText = "ON";
                    fanBadge.className = "status-badge fan-on";
                    fanIcon.className = "rotating-fan"; // Spin animation
                } else {
                    fanBadge.innerText = "OFF";
                    fanBadge.className = "status-badge fan-off";
                    fanIcon.className = "stopped-fan";  // Stop animation
                }

                // Sync time update
                let now = new Date();
                document.getElementById("syncTime").innerText = "Last synced: " + now.toLocaleTimeString();
            }
        } catch (error) {
            console.error("Error fetching data:", error);
        }
    }

    setInterval(fetchData, 2000); // Fetch every 2 seconds
    fetchData();
</script>

</body>
</html>
